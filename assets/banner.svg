<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 440 110">
  <defs>
    <style>
      .px { shape-rendering: crispEdges; }
      text { font-family: "Courier New", ui-monospace, monospace; font-weight: bold; }
    </style>
  </defs>
  <rect width="440" height="110" fill="#1E1930"/>
  <!-- floor strip -->
  <rect y="86" width="440" height="24" fill="#2A2342" class="px"/>
  <rect y="86" width="440" height="2" fill="#3A3253" class="px"/>
  <!-- office building -->
  <g class="px">
    <rect x="28" y="22" width="64" height="64" fill="#33283B"/>
    <rect x="31" y="25" width="58" height="58" fill="#E8804C"/>
    <rect x="31" y="25" width="58" height="12" fill="#D2664A"/>
    <!-- windows -->
    <rect x="37" y="42" width="10" height="10" fill="#F6E7B2"/>
    <rect x="55" y="42" width="10" height="10" fill="#1E1930"/>
    <rect x="73" y="42" width="10" height="10" fill="#F6E7B2"/>
    <rect x="37" y="58" width="10" height="10" fill="#F6E7B2"/>
    <rect x="55" y="58" width="10" height="10" fill="#F6E7B2"/>
    <rect x="73" y="58" width="10" height="10" fill="#1E1930"/>
    <!-- door -->
    <rect x="53" y="70" width="14" height="16" fill="#33283B"/>
    <rect x="55" y="72" width="10" height="14" fill="#8C5A3C"/>
  </g>
  <!-- tiny employee sprites -->
  <g class="px">
    <g transform="translate(104,66)">
      <rect x="2" y="0" width="8" height="5" fill="#362F44"/><rect x="2" y="4" width="8" height="7" fill="#F4CCA6"/>
      <rect x="1" y="10" width="10" height="9" fill="#3E8E7E"/><rect x="2" y="19" width="3" height="4" fill="#3E3852"/><rect x="7" y="19" width="3" height="4" fill="#3E3852"/>
    </g>
    <g transform="translate(122,66)">
      <rect x="2" y="0" width="8" height="5" fill="#A84E32"/><rect x="2" y="4" width="8" height="7" fill="#E0B183"/>
      <rect x="1" y="10" width="10" height="9" fill="#6FA357"/><rect x="2" y="19" width="3" height="4" fill="#3E3852"/><rect x="7" y="19" width="3" height="4" fill="#3E3852"/>
    </g>
    <g transform="translate(140,66)">
      <rect x="2" y="0" width="8" height="5" fill="#A8A4B0"/><rect x="2" y="4" width="8" height="7" fill="#C08A5C"/>
      <rect x="1" y="10" width="10" height="9" fill="#3E5077"/><rect x="2" y="19" width="3" height="4" fill="#3E3852"/><rect x="7" y="19" width="3" height="4" fill="#3E3852"/>
    </g>
  </g>
  <!-- speech bubble -->
  <g class="px">
    <rect x="150" y="46" width="46" height="16" rx="3" fill="#F8F5EE"/>
    <rect x="156" y="52" width="6" height="4" fill="#33283B"/>
    <rect x="166" y="52" width="6" height="4" fill="#33283B"/>
    <rect x="176" y="52" width="6" height="4" fill="#33283B"/>
  </g>
  <!-- wordmark -->
  <text x="212" y="56" font-size="30" fill="#F8F5EE" letter-spacing="2">PIXEL<tspan fill="#E8804C">CORP</tspan></text>
  <text x="213" y="74" font-size="10.5" fill="#9A92B5" letter-spacing="1">your AI company, in a cozy pixel office</text>
</svg>
